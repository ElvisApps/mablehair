<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Mable Hair Care</title>
    <link rel="icon" href="image/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .wishlist-page { padding: 8rem 0 4rem; min-height: 80vh; }
        .wishlist-header { text-align: center; margin-bottom: 3rem; }
        .empty-wishlist { text-align: center; padding: 4rem 2rem; background: var(--card-bg); border-radius: var(--border-radius); max-width: 600px; margin: 0 auto; }
        .empty-wishlist i { font-size: 4rem; color: #e0e0e0; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 0.5rem;">
                <img src="image/logo.png" alt="Mable Hair Care Logo" style="height: 40px; width: auto; border-radius: 5px;">
                <span>Mable Hair Care</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-icons">
                <a href="wishlist.html" class="icon-btn" style="color: var(--error-color)">
                    <i class="fas fa-heart"></i>
                </a>
                <a href="cart.html" class="icon-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" style="display:none;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="shop.html" class="mobile-nav-item"><i class="fas fa-store"></i><span>Shop</span></a>
        <a href="wishlist.html" class="mobile-nav-item active"><i class="fas fa-heart"></i><span>Wishlist</span></a>
        <a href="cart.html" class="mobile-nav-item">
            <div style="position:relative">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count" style="display:none; top:-5px; right:-10px;">0</span>
            </div>
            <span>Cart</span>
        </a>
    </nav>

    <div class="wishlist-page container">
        <div class="wishlist-header reveal">
            <h1>Your Wishlist</h1>
        </div>
        
        <div class="products-grid reveal" id="wishlistGrid">
            <!-- Injected by JS -->
        </div>
    </div>

    <footer>
        <div class="container footer-grid">
            <div class="footer-col">
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                    <img src="image/logo.png" alt="Mable Hair Care Logo" style="height: 50px; width: auto; border-radius: 5px; background: rgba(255,255,255,0.9); padding: 4px;">
                    <h3 style="color: var(--bg-color); font-size: 1.5rem; margin: 0;">Mable Hair Care</h3>
                </div>
                <p style="color: #ccc; font-size: 0.9rem;">Authentic, natural hair care for stronger, healthier-looking hair.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderWishlist();
        });

        function renderWishlist() {
            const grid = document.getElementById('wishlistGrid');
            
            if (wishlist.length === 0) {
                grid.style.gridTemplateColumns = '1fr';
                grid.innerHTML = `
                    <div class="empty-wishlist">
                        <i class="far fa-heart"></i>
                        <h2>Your wishlist is empty</h2>
                        <p style="color: var(--text-light); margin: 1rem 0 2rem;">Save your favorite items here to purchase them later.</p>
                        <a href="shop.html" class="btn btn-primary">Discover Products</a>
                    </div>
                `;
                return;
            }

            grid.style.gridTemplateColumns = '';
            
            const wishlistProducts = wishlist.map(id => products.find(p => p.id === id)).filter(Boolean);
            grid.innerHTML = wishlistProducts.map(p => createProductCard(p)).join('');
        }

        // Override the toggle Wishlist specifically for this page to re-render
        const originalToggle = toggleWishlist;
        toggleWishlist = function(event, productId, btnElement) {
            originalToggle(event, productId, btnElement);
            renderWishlist(); // re-render grid
        };
    </script>
</body>
</html>
